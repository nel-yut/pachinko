<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>検証画面 - パチンコ基盤</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><h1>検証画面 <small>リリース前用・遊技画面とは別</small></h1><nav><a href="index.html">遊技画面へ</a></nav></header>
<main class="vwrap">
  <p class="note">抽選の統計検証・ルール検証・遊技フロー高速試行（盤面アニメーション省略）・盤面物理の到達率を実行します。通常遊技と同じ抽選・状態遷移ロジックを通します。乱数は再現可能な検証用シードです。</p>
  <div class="vgrid">
    <label>プロファイル <select id="profile"></select></label>
    <label>乱数シード <input type="text" id="seed" value="1"></label>
    <label>抽選試行数（特図×状態ごと） <input type="number" id="draws" value="1000000" min="1000" step="1000"></label>
    <label>遊技フロー発射数 <input type="number" id="launches" value="1000000" min="1000" step="1000"></label>
    <label>物理: 強度ごとの発射数 <input type="number" id="balls" value="300" min="10" step="10"></label>
  </div>
  <div class="btns"><button id="run" type="button">検証を実行</button><button id="dl" type="button" disabled>JSONを保存</button><span id="status" class="note"></span></div>
  <pre id="out">（未実行）</pre>
</main>
<script type="module">
import { FEATURES } from './src/config/features.js';
import { PRESETS, getPreset } from './src/presets/index.js';
const $ = (i) => document.getElementById(i);
if (!FEATURES.verification) { document.body.innerHTML = '<p style="padding:16px">検証機能は無効化されています。</p>'; }
else {
  for (const p of PRESETS) $('profile').add(new Option(p.name, p.id));
  let last = null;
  $('run').onclick = () => {
    const w = new Worker('src/verify/worker.js', { type: 'module' });
    $('run').disabled = true; $('out').textContent = '実行中…';
    w.onmessage = (e) => {
      const m = e.data;
      if (m.type === 'progress') $('status').textContent = `実行中: ${m.stage}`;
      else { $('run').disabled = false; $('status').textContent = m.type === 'done' ? '完了' : 'エラー'; if (m.type === 'done') { last = m.json; $('out').textContent = m.text; $('dl').disabled = false; } else $('out').textContent = m.message; w.terminate(); }
    };
    w.onerror = (e) => { $('run').disabled = false; $('out').textContent = `Worker エラー: ${e.message}`; };
    w.postMessage({ config: getPreset($('profile').value), opts: { seed: $('seed').value, draws: Number($('draws').value), launches: Number($('launches').value), ballsPerStrength: Number($('balls').value) } });
  };
  $('dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(last, null, 2)], { type: 'application/json' })); a.download = `verification-${last.generatedFrom.profile}-seed${last.generatedFrom.seed}.json`; a.click(); };
}
</script>
</body>
</html>
